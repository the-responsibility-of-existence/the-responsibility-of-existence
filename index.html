<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Responsibility of Existence: an ethical and philosophical framework for intelligence, care, freedom, accountability and responsible development.">
  <meta name="theme-color" content="#f4f0e8">
  <title>The Responsibility of Existence — Version 3.5</title>
  <style>
    :root {
      --paper: #f4f0e8;
      --paper-deep: #e9e1d4;
      --ink: #252c29;
      --muted: #606963;
      --green: #35584b;
      --green-dark: #243e35;
      --line: #d7d0c3;
      --white: #fffdf8;
      --max: 920px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.72;
      font-size: 17px;
    }

    a {
      color: var(--green-dark);
      text-underline-offset: 3px;
    }

    a:hover { color: #6a4730; }

    .skip {
      position: absolute;
      left: -9999px;
      top: 0;
    }

    .skip:focus {
      left: 1rem;
      top: 1rem;
      background: white;
      padding: .6rem;
      z-index: 10;
    }

    header {
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--line);
      background: rgba(244,240,232,.95);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(10px);
    }

    .nav {
      max-width: 1160px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .brand {
      color: var(--green-dark);
      font-size: .98rem;
      font-weight: bold;
      text-decoration: none;
      letter-spacing: .02em;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .9rem;
    }

    nav a {
      font: 600 .82rem/1.4 system-ui, sans-serif;
      text-decoration: none;
      color: var(--muted);
    }

    .hero {
      padding: clamp(4rem, 10vw, 8rem) 1.25rem 4.5rem;
      text-align: center;
      background: linear-gradient(180deg, var(--paper), #eee7da);
    }

    .eyebrow {
      font: 700 .75rem/1.4 system-ui, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--green);
    }

    h1, h2, h3 {
      line-height: 1.2;
      color: var(--green-dark);
    }

    h1 {
      font-size: clamp(2.5rem, 7vw, 5.2rem);
      max-width: 1000px;
      margin: 1rem auto;
      letter-spacing: -.04em;
      font-weight: 500;
    }

    .subtitle {
      max-width: 700px;
      margin: 0 auto 1.7rem;
      font-size: clamp(1.1rem, 2.6vw, 1.45rem);
      color: #4f5952;
    }

    .hero-quote {
      max-width: 760px;
      margin: 2rem auto 0;
      padding: 1.3rem 1.5rem;
      border-top: 1px solid #c9c1b3;
      border-bottom: 1px solid #c9c1b3;
      font-size: clamp(1.2rem, 2.7vw, 1.7rem);
      font-style: italic;
    }

    .meta {
      font: .82rem/1.5 system-ui, sans-serif;
      color: var(--muted);
      margin-top: 1.3rem;
    }

    main {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 1.25rem 4rem;
    }

    section {
      padding: 3rem 0;
      border-bottom: 1px solid var(--line);
      scroll-margin-top: 90px;
    }

    h2 {
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 500;
      margin: 0 0 1.3rem;
      letter-spacing: -.02em;
    }

    h3 {
      font-size: 1.35rem;
      margin: 2rem 0 .6rem;
    }
