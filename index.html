<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Responsibility of Existence: a philosophy of understanding, responsibility, freedom and the symbiosis of the universe.">
  <meta name="theme-color" content="#f4f0e8">
  <title>The Responsibility of Existence</title>
  <style>
    :root {
      --paper: #f4f0e8;
      --paper-deep: #ebe4d8;
      --ink: #282821;
      --muted: #68675e;
      --accent: #526b5a;
      --accent-dark: #354b3d;
      --line: #d9d0c2;
      --card: rgba(255,255,255,.42);
      --content: 790px;
      --wide: 1120px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.78;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-dark); text-underline-offset: 3px; }
    a:hover { color: #26392d; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(244,240,232,.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }
    .nav-wrap {
      max-width: var(--wide);
      min-height: 66px;
      margin: 0 auto;
      padding: 0 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand {
      color: var(--ink);
      text-decoration: none;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .07em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .nav-links { display: flex; flex-wrap: wrap; gap: 19px; align-items: center; }
    .nav-links a {
      color: var(--muted);
      font: 14px/1.4 Arial, sans-serif;
      text-decoration: none;
    }
    .nav-links a:hover { color: var(--accent-dark); }
    .hero {
      padding: 112px 24px 94px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.62), transparent 68%),
        linear-gradient(180deg, #f7f4ee 0%, var(--paper) 100%);
    }
    .eyebrow {
      margin: 0 0 20px;
      color: var(--accent);
      font: bold 12px/1.4 Arial, sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 900px;
      margin: 0 auto;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.04;
      font-weight: normal;
      letter-spacing: -.045em;
    }
    .subtitle {
      max-width: 690px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(19px, 2.4vw, 25px);
      line-height: 1.5;
      font-style: italic;
    }
    .hero-rule {
      width: 66px;
      height: 1px;
      margin: 38px auto 0;
      background: var(--accent);
    }
    .intro {
      max-width: 760px;
      margin: 0 auto;
      padding: 66px 26px 42px;
      text-align: center;
    }
    .intro p { margin: 0 0 18px; }
    .intro .thesis {
      margin-top: 30px;
      color: var(--accent-dark);
      font-size: 23px;
      line-height: 1.55;
      font-style: italic;
    }
